name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --selectProjects unit

      - name: Build release bundle
        run: npm run build:release

      - name: Verify release version
        run: |
          node -e '
          const fs = require("fs");
          const tag = process.env.GITHUB_REF_NAME;
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("dist/grimoire/manifest.json", "utf8"));
          if (pkg.version !== tag || manifest.version !== tag) {
            console.error("Release tag " + tag + " must match package.json (" + pkg.version + ") and manifest.json (" + manifest.version + ").");
            process.exit(1);
          }
          '

      - name: Verify release assets
        run: |
          test -s dist/grimoire/main.js
          test -s dist/grimoire/manifest.json
          test -s dist/grimoire/styles.css

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/grimoire/main.js
            dist/grimoire/manifest.json
            dist/grimoire/styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="Grimoire ${tag}"
          notes="Grimoire ${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              dist/grimoire/main.js \
              dist/grimoire/manifest.json \
              dist/grimoire/styles.css \
              --clobber
          else
            gh release create "${tag}" \
              dist/grimoire/main.js \
              dist/grimoire/manifest.json \
              dist/grimoire/styles.css \
              --title "${title}" \
              --notes "${notes}" \
              --verify-tag
          fi
